# Fly.io app config. Before your first deploy:
#   1. Change `app` below to a globally-unique name (Fly checks this when
#      you run `fly apps create`).
#   2. Optionally change `primary_region` - run `fly platform regions` to
#      see the list, pick whichever is closest to you.
# See DEPLOYMENT.md for the full step-by-step.

app = "smart-accounting-rima"
primary_region = "iad"

[build]

[env]
  # Non-secret only - the Gemini API_KEY goes in via `fly secrets set`,
  # never here (this file is meant to be committed).
  DATABASE_URL = "sqlite:////data/accounting.db"
  SQLITE_DATA_DIR = "/data"

[[mounts]]
  source = "accounting_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
