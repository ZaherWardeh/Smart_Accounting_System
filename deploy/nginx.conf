# Nginx reverse proxy in front of the app - used by BOTH deployment
# scenarios in DEPLOYMENT.md (plain venv+systemd, or Docker); either way
# the app itself only listens on 127.0.0.1:8000, never directly exposed.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/smart-accounting
#   sudo ln -s /etc/nginx/sites-available/smart-accounting /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get a free TLS cert (replace server_name below with your real
# domain first, or drop the certbot step and stay on plain HTTP if
# you're only reachable by IP, not a domain):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.example

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;  # or the server's static IP

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Response streaming isn't needed for this app's endpoints, but
        # keep buffering off for a snappier chat UI experience regardless.
        proxy_buffering off;
    }
}
