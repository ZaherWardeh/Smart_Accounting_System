<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ريما - المحاسبة الذكية</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --accent: #2f6f4f;
    --accent-dark: #245a3f;
    --user-bubble: #2f6f4f;
    --user-text: #ffffff;
    --bot-bubble: #eef1f0;
    --bot-text: #1f2a24;
    --error-bubble: #fdecea;
    --error-text: #8a1c1c;
    --muted: #6b7280;
    --border: #e2e5e4;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--bot-text);
  }
  body { display: flex; flex-direction: column; }
  .app {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: var(--panel);
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  .app > header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--accent);
    color: white;
  }
  header .identity { display: flex; align-items: center; gap: 10px; }
  header .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 18px;
  }
  header h1 { font-size: 16px; margin: 0; }
  header p { font-size: 12px; margin: 2px 0 0; opacity: 0.85; }
  header button {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,0.28); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .bubble.user {
    align-self: flex-start;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-left-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-end;
    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.error {
    background: var(--error-bubble);
    color: var(--error-text);
  }
  .bubble.typing { color: var(--muted); font-style: italic; }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 20px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 120px;
  }
  #input:focus { outline: 2px solid var(--accent); }
  #send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  #send:hover { background: var(--accent-dark); }
  #send:disabled { opacity: 0.5; cursor: default; }

  #attachBtn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 12px;
    font-size: 18px;
    cursor: pointer;
  }
  #attachBtn:disabled { opacity: 0.5; cursor: default; }
  #attachmentPreview {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    background: var(--bot-bubble);
    font-size: 13px;
  }
  #attachmentPreview[hidden] { display: none; }
  #attachmentPreview img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
  #attachmentPreview .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #attachmentPreview button { border: none; background: none; font-size: 18px; cursor: pointer; }
  .bubble img.doc { display: block; max-width: 100%; max-height: 160px; border-radius: 8px; margin-bottom: 6px; }

  #pending { padding: 0 14px; }
  .pending-card {
    margin: 8px 0 0;
    padding: 10px 14px;
    border-radius: 10px;
    background: #fff4d6;
    border: 1px solid #f0d58a;
    font-size: 13.5px;
  }
  .pending-card.alert { background: var(--error-bubble); border-color: #e8a5a0; color: var(--error-text); }
  .pending-card .title { font-weight: 600; margin-bottom: 4px; }
  .pending-card .state { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .pending-card .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .pending-card button {
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .pending-card button.confirm { background: var(--accent); color: white; border-color: var(--accent); }
  .pending-card button.abort { color: var(--error-text); }
  .pending-card button:disabled { opacity: 0.5; cursor: default; }

  #convId {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 4px 0 0;
  }
</style>
</head>
<body>
  <header class="topnav">
    <div class="brand"><span class="dot">ر</span> نظام المحاسبة الذكي</div>
    <nav>
      <a href="/">الرئيسية</a>
      <a href="/accounts">الحسابات</a>
      <a href="/transactions">القيود</a>
      <a href="/reports">التقارير</a>
      <a href="/chat" class="active">ريما 🤖</a>
    </nav>
  </header>
  <div class="app">
    <header>
      <div class="identity">
        <div class="avatar">ر</div>
        <div>
          <h1>ريما — Rima</h1>
          <p>مساعدتك المحاسبية الذكية · Your smart accounting assistant</p>
        </div>
      </div>
      <button id="newChat" type="button">محادثة جديدة</button>
    </header>

    <div id="messages">
      <div class="empty-state" id="emptyState">
        اسأل ريما عن دليل الحسابات، حركة أي حساب، أو رصيده...<br>
        Ask Rima about the chart of accounts, an account's activity, or its balance...
      </div>
    </div>

    <div id="pending"></div>
    <div id="attachmentPreview" hidden>
      <img id="attachmentThumb" alt="">
      <span class="name" id="attachmentName"></span>
      <button type="button" id="attachmentRemove" title="إزالة المرفق">✕</button>
    </div>

    <form id="composer">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <button id="attachBtn" type="button" title="إرفاق صورة مستند (فاتورة...)">📎</button>
      <textarea id="input" rows="1" placeholder="اكتب سؤالك هون..." dir="auto"></textarea>
      <button id="send" type="submit">إرسال</button>
    </form>
    <div id="convId"></div>
  </div>

<script>
  const API_URL = "/reports/ask_ai";
  const STORAGE_KEY = "rima_conversation_id";

  function getConversationId() {
    let id = localStorage.getItem(STORAGE_KEY);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(STORAGE_KEY, id);
    }
    return id;
  }

  function renderConvId() {
    document.getElementById("convId").textContent = "conversation_id: " + getConversationId();
  }

  const EMPTY_STATE_HTML = '<div class="empty-state" id="emptyState">' +
    'اسأل ريما عن دليل الحسابات، حركة أي حساب، أو رصيده...<br>' +
    "Ask Rima about the chart of accounts, an account's activity, or its balance..." +
    '</div>';
  const IDLE_ALERT_MS = 60000;
  const STEP_LABELS = {
    debit_account: "حساب المدين", credit_account: "حساب الدائن", amount: "المبلغ", confirmation: "التأكيد",
    name: "اسم الحساب", parent_account: "الحساب الأب", close_in: "نوع الإغلاق", code: "رمز الحساب"
  };

  let attachment = null;      // {data_base64, filename, mime, previewUrl}
  let pendingDrafts = [];
  let idleTimer = null;
  let alerting = false;
  let busy = false;

  async function newConversation() {
    if (pendingDrafts.length) {
      const lines = pendingDrafts.map(draftSummary).join("\n");
      if (!confirm("عندك عملية غير محفوظة:\n" + lines + "\n\nبدء محادثة جديدة رح يلغي هذه العملية. متابعة؟")) return;
      for (const d of pendingDrafts) {
        try { await fetch("/drafts/" + getConversationId() + "/" + d.kind + "/cancel", { method: "POST" }); } catch (_) {}
      }
    }
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById("messages").innerHTML = EMPTY_STATE_HTML;
    setAttachment(null);
    setPending([]);
    getConversationId();
    renderConvId();
  }

  function appendMessage(role, text, imageUrl) {
    const messages = document.getElementById("messages");
    const emptyState = document.getElementById("emptyState");
    if (emptyState) emptyState.remove();

    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    bubble.dir = "auto";
    if (imageUrl) {
      const img = document.createElement("img");
      img.className = "doc";
      img.src = imageUrl;
      img.alt = "";
      bubble.appendChild(img);
    }
    bubble.appendChild(document.createTextNode(text));
    messages.appendChild(bubble);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  function setBubbleText(bubble, text, className) {
    bubble.replaceChildren(document.createTextNode(text));
    bubble.className = className;
  }

  // ---- document attachment -------------------------------------------------

  function setAttachment(att) {
    if (attachment && attachment.previewUrl && (!att || att.previewUrl !== attachment.previewUrl)) {
      // the bubble keeps its own copy of the URL, so only free it when nothing sent it
      if (!attachment.sent) URL.revokeObjectURL(attachment.previewUrl);
    }
    attachment = att;
    const box = document.getElementById("attachmentPreview");
    box.hidden = !att;
    if (att) {
      document.getElementById("attachmentThumb").src = att.previewUrl;
      document.getElementById("attachmentName").textContent = att.filename;
    }
  }

  // Downscale on the client: a bill stays readable at 1600 px and the upload is a few hundred KB.
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(url);
          if (!blob) return reject(new Error("resize failed"));
          const reader = new FileReader();
          reader.onload = () => resolve({
            data_base64: String(reader.result).split(",")[1],
            filename: file.name.replace(/\.[^.]+$/, "") + ".jpg",
            mime: "image/jpeg",
            previewUrl: URL.createObjectURL(blob)
          });
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        }, "image/jpeg", 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("not an image")); };
      img.src = url;
    });
  }

  async function onFilePicked(event) {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      setAttachment(await resizeImage(file));
      userActivity();
    } catch (_) {
      appendMessage("assistant error", "⚠️ تعذر قراءة الصورة. جرّب ملف JPG أو PNG.");
    }
  }

  // ---- unsaved operations ----------------------------------------------------

  function draftSummary(d) {
    const acc = (a) => a ? ((a.code ? a.code + " - " : "") + a.name) : "—";
    const x = d.draft || {};
    if (d.kind === "transaction") {
      return "قيد: مدين " + acc(x.debit_account) + " / دائن " + acc(x.credit_account) +
        (x.amount != null ? " بمبلغ " + x.amount : "");
    }
    return "حساب جديد: " + (x.name || "—") + (x.parent_account ? " تحت " + acc(x.parent_account) : "");
  }

  function setPending(list) {
    pendingDrafts = Array.isArray(list) ? list : [];
    alerting = false;
    renderPending();
    armIdle();
  }

  function armIdle() {
    clearTimeout(idleTimer);
    if (!pendingDrafts.length) return;
    idleTimer = setTimeout(() => { if (!busy && pendingDrafts.length) { alerting = true; renderPending(); } }, IDLE_ALERT_MS);
  }

  function userActivity() {
    if (!pendingDrafts.length) return;
    if (alerting) { alerting = false; renderPending(); }
    armIdle();
  }

  function renderPending() {
    const host = document.getElementById("pending");
    host.replaceChildren();
    for (const d of pendingDrafts) {
      const card = document.createElement("div");
      card.className = "pending-card" + (alerting ? " alert" : "");
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = (alerting ? "⚠️ لسا عندك عملية غير محفوظة!" : "عملية غير محفوظة") + " — " + draftSummary(d);
      const state = document.createElement("div");
      state.className = "state";
      state.textContent = d.ready_to_confirm ? "جاهزة للتأكيد" : "ناقص: " + (STEP_LABELS[d.next_step] || d.next_step);
      const btns = document.createElement("div");
      btns.className = "btns";
      const mk = (label, cls, handler) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = cls; b.textContent = label; b.disabled = busy;
        b.addEventListener("click", handler);
        btns.appendChild(b);
      };
      if (d.ready_to_confirm) mk("تأكيد", "confirm", () => confirmDraft(d.kind));
      mk(d.ready_to_confirm ? "تعديل" : "متابعة", "modify", () => sendText("بدي أعدّل على العملية غير المحفوظة"));
      mk("إلغاء", "abort", () => cancelDraft(d.kind));
      card.append(title, state, btns);
      host.appendChild(card);
    }
  }

  async function draftAction(kind, action) {
    busy = true; renderPending();
    try {
      const res = await fetch("/drafts/" + getConversationId() + "/" + kind + "/" + action, { method: "POST" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const d = data.detail;
        const known = { incomplete: "العملية غير مكتملة بعد، أكمل المعلومات الناقصة أولاً", no_draft: "ما في عملية معلّقة",
                        invalid_draft: "بيانات العملية لم تعد صالحة، راجعها مع ريما" };
        appendMessage("assistant error", "⚠️ " + (typeof d === "string" ? d : (d && known[d.error]) || "تعذر تنفيذ الطلب"));
        await loadPending();
        return null;
      }
      return data;
    } catch (_) {
      appendMessage("assistant error", "⚠️ تعذر الاتصال بالخادم.");
      return null;
    } finally {
      busy = false; renderPending();
    }
  }

  async function confirmDraft(kind) {
    const data = await draftAction(kind, "confirm");
    if (!data) return;
    const a = data.account || {};
    appendMessage("assistant", kind === "transaction"
      ? "تم حفظ القيد رقم " + data.transaction_id + "."
      : "تم إنشاء الحساب " + (a.code ? a.code + " - " : "") + (a.name || "") + ".");
    setPending(data.pending_drafts);
  }

  async function cancelDraft(kind) {
    const data = await draftAction(kind, "cancel");
    if (!data) return;
    appendMessage("assistant", "تم إلغاء العملية غير المحفوظة.");
    setPending(data.pending_drafts);
  }

  async function loadPending() {
    try {
      const res = await fetch("/drafts/" + getConversationId());
      if (res.ok) setPending(await res.json());
    } catch (_) {}
  }

  // ---- sending ---------------------------------------------------------------

  async function sendText(question) {
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const att = attachment;
    question = (question || "").trim();
    if ((!question && !att) || busy) return;

    input.value = "";
    input.style.height = "auto";
    if (att) att.sent = true;
    appendMessage("user", question || ("📎 " + att.filename), att ? att.previewUrl : null);
    setAttachment(null);
    const pendingBubble = appendMessage("assistant typing", "ريما عم تفكر...");
    sendBtn.disabled = true;
    busy = true;
    clearTimeout(idleTimer);
    alerting = false;
    renderPending();

    try {
      const body = { conversation_id: getConversationId(), question: question };
      if (att) body.attachment = { data_base64: att.data_base64, filename: att.filename, mime: att.mime };
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        let msg = "HTTP " + res.status;
        try {
          const errJson = await res.json();
          if (errJson.detail) msg = typeof errJson.detail === "string" ? errJson.detail : JSON.stringify(errJson.detail);
        } catch (_) {}
        setBubbleText(pendingBubble, "⚠️ " + msg, "bubble assistant error");
        if (att) setAttachment(att);   // let the user retry without picking the file again
        return;
      }

      const data = await res.json();
      setBubbleText(pendingBubble, data.answer, "bubble assistant");
      busy = false;
      setPending(data.pending_drafts);
    } catch (err) {
      setBubbleText(pendingBubble, "⚠️ تعذر الاتصال بالخادم. تأكد إنو السيرفر شغال.", "bubble assistant error");
      if (att) setAttachment(att);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      renderPending();
      armIdle();
      input.focus();
    }
  }

  function sendMessage(event) {
    event.preventDefault();
    sendText(document.getElementById("input").value);
  }

  document.getElementById("composer").addEventListener("submit", sendMessage);
  document.getElementById("newChat").addEventListener("click", newConversation);
  document.getElementById("attachBtn").addEventListener("click", () => document.getElementById("fileInput").click());
  document.getElementById("fileInput").addEventListener("change", onFilePicked);
  document.getElementById("attachmentRemove").addEventListener("click", () => setAttachment(null));

  const inputEl = document.getElementById("input");
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      document.getElementById("composer").requestSubmit();
    }
  });
  inputEl.addEventListener("input", () => {
    userActivity();
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  renderConvId();
  loadPending();   // an operation left unsaved earlier is shown again
  inputEl.focus();
</script>
</body>
</html>
