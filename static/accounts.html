<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحسابات — نظام المحاسبة الذكي</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topnav">
    <div class="brand"><span class="dot">ر</span> نظام المحاسبة الذكي</div>
    <nav>
      <a href="/">الرئيسية</a>
      <a href="/accounts" class="active">الحسابات</a>
      <a href="/transactions">القيود</a>
      <a href="/reports">التقارير</a>
      <a href="/chat">ريما 🤖</a>
    </nav>
  </header>

  <main class="page">
    <h1>دليل الحسابات</h1>
    <p class="subtitle">استعراض، إضافة، تعديل، وحذف الحسابات.</p>

    <div id="alertBox"></div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">كل الحسابات</h2>
        <button class="btn btn-primary" id="addBtn" type="button">+ حساب جديد</button>
      </div>
      <div class="tree" id="accountsTree"></div>
      <div class="empty-state" id="emptyState" hidden>لا يوجد حسابات بعد.</div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">حساب جديد</h2>
      <form id="accountForm">
        <div class="field-row">
          <div class="field" style="flex: 0 0 120px;">
            <label for="code">رمز الحساب</label>
            <input type="text" id="code" placeholder="مثال: 001">
          </div>
          <div class="field">
            <label for="name">اسم الحساب</label>
            <input type="text" id="name" required>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="closeIn">نوع الإغلاق</label>
            <select id="closeIn">
              <option value="0">ميزانية عمومية (Balance Sheet)</option>
              <option value="1">أرباح وخسائر (P&amp;L)</option>
              <option value="2">متاجرة (Trading)</option>
            </select>
          </div>
          <div class="field">
            <label for="parentAccount">الحساب الأب</label>
            <select id="parentAccount">
              <option value="">— بدون —</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelBtn">إلغاء</button>
          <button type="submit" class="btn btn-primary">حفظ</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const CLOSE_IN_LABELS = { 0: "ميزانية عمومية", 1: "أرباح وخسائر", 2: "متاجرة" };

  let accounts = [];
  let editingId = null;

  function showAlert(msg, type = 'error') {
    document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  }
  function clearAlert() {
    document.getElementById('alertBox').innerHTML = '';
  }

  function renderNode(a, childrenOf) {
    const kids = childrenOf[a.id] || [];
    const isMaster = kids.length > 0;
    const badge = isMaster
      ? '<span class="badge master">رئيسي</span>'
      : '<span class="badge">فرعي</span>';
    const toggle = isMaster
      ? '<span class="tree-toggle" onclick="toggleNode(this)">▾</span>'
      : '<span class="tree-toggle leaf"></span>';

    let html = `
      <li>
        <div class="tree-node">
          ${toggle}
          ${a.code ? `<span class="badge">${a.code}</span>` : ''}
          <span class="tree-name">${a.name}</span>
          ${badge}
          <span class="tree-meta">${CLOSE_IN_LABELS[a.closeIn] ?? a.closeIn} · #${a.id}</span>
          <span class="row-actions">
            <button class="btn btn-sm" onclick="openEdit(${a.id})">تعديل</button>
            <button class="btn btn-sm btn-danger" onclick="deleteAccount(${a.id})">حذف</button>
          </span>
        </div>
    `;
    if (isMaster) {
      html += `<ul>${kids.map(k => renderNode(k, childrenOf)).join('')}</ul>`;
    }
    html += `</li>`;
    return html;
  }

  function compareByCode(a, b) {
    if (!!a.code !== !!b.code) return a.code ? -1 : 1; // coded accounts before uncoded ones
    if (a.code && b.code) return a.code.localeCompare(b.code, undefined, { numeric: true });
    return a.name.localeCompare(b.name, 'ar');
  }

  function toggleNode(el) {
    const li = el.closest('li');
    const sub = li.querySelector(':scope > ul');
    if (!sub) return;
    if (sub.hasAttribute('hidden')) {
      sub.removeAttribute('hidden');
      el.textContent = '▾';
    } else {
      sub.setAttribute('hidden', '');
      el.textContent = '▸';
    }
  }

  function renderTree() {
    const container = document.getElementById('accountsTree');
    const empty = document.getElementById('emptyState');
    if (accounts.length === 0) {
      container.innerHTML = '';
      empty.hidden = false;
      return;
    }
    empty.hidden = true;

    const idSet = new Set(accounts.map(a => a.id));
    const childrenOf = {};
    accounts.forEach(a => {
      (childrenOf[a.parentAccount] = childrenOf[a.parentAccount] || []).push(a);
    });
    Object.values(childrenOf).forEach(list => list.sort(compareByCode));

    // treat an account as a root if it has no parent, or its parent no longer exists
    const roots = accounts
      .filter(a => a.parentAccount === null || !idSet.has(a.parentAccount))
      .sort(compareByCode);

    container.innerHTML = `<ul>${roots.map(a => renderNode(a, childrenOf)).join('')}</ul>`;
  }

  function populateParentSelect() {
    const sel = document.getElementById('parentAccount');
    const current = sel.value;
    sel.innerHTML = '<option value="">— بدون —</option>' +
      accounts
        .filter(a => a.id !== editingId)
        .map(a => `<option value="${a.id}">${a.code ? a.code + ' — ' : ''}${a.name}</option>`)
        .join('');
    sel.value = current;
  }

  async function loadAccounts() {
    try {
      const res = await fetch('/accounts/');
      accounts = await res.json();
      renderTree();
      populateParentSelect();
    } catch (e) {
      showAlert('تعذر تحميل الحسابات.');
    }
  }

  function openModal() { document.getElementById('modalOverlay').hidden = false; }
  function closeModal() { document.getElementById('modalOverlay').hidden = true; }

  function openAdd() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'حساب جديد';
    document.getElementById('code').value = '';
    document.getElementById('name').value = '';
    document.getElementById('closeIn').value = '0';
    populateParentSelect();
    document.getElementById('parentAccount').value = '';
    openModal();
  }

  function openEdit(id) {
    const acc = accounts.find(a => a.id === id);
    if (!acc) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'تعديل حساب';
    document.getElementById('code').value = acc.code || '';
    document.getElementById('name').value = acc.name;
    document.getElementById('closeIn').value = String(acc.closeIn);
    populateParentSelect();
    document.getElementById('parentAccount').value = acc.parentAccount ?? '';
    openModal();
  }

  async function deleteAccount(id) {
    if (!confirm('متأكد من حذف هذا الحساب؟')) return;
    clearAlert();
    try {
      const res = await fetch(`/accounts/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showAlert(err.detail || `تعذر حذف الحساب (${res.status}).`);
        return;
      }
      await loadAccounts();
    } catch (e) {
      showAlert('تعذر الاتصال بالخادم.');
    }
  }

  document.getElementById('addBtn').addEventListener('click', openAdd);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);

  document.getElementById('accountForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert();
    const payload = {
      code: document.getElementById('code').value.trim() || null,
      name: document.getElementById('name').value.trim(),
      closeIn: Number(document.getElementById('closeIn').value),
      parentAccount: document.getElementById('parentAccount').value
        ? Number(document.getElementById('parentAccount').value)
        : null,
    };
    if (!payload.name) return;

    try {
      let res;
      if (editingId) {
        res = await fetch('/accounts/', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: editingId, ...payload }),
        });
      } else {
        res = await fetch('/accounts/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showAlert(err.detail || `تعذر حفظ الحساب (${res.status}).`);
        return;
      }
      closeModal();
      await loadAccounts();
    } catch (e) {
      showAlert('تعذر الاتصال بالخادم.');
    }
  });

  loadAccounts();
</script>
</body>
</html>
